[project]
name = "harnyx-dashboard"
version = "0.1.0"
description = "Operator monitoring dashboard for Harnyx (SN67) miners."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Harnyx Labs", email = "engineering@harnyx.example" }
]
dependencies = [
  "harnyx-miner>=0.1.0",
  "fastapi>=0.133,<1",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.scripts]
harnyx-dashboard = "harnyx_dashboard.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnyx_dashboard"]
include = [
  "src/harnyx_dashboard/static/*.html",
]

[tool.deptry.package_module_name_map]
harnyx-miner = "harnyx_miner"
